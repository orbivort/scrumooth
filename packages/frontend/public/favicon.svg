<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
  <title>Scrumooth</title>
  <defs>
    <linearGradient id="scrumoothFaviconFlow" x1="14" y1="10" x2="86" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="scrumoothFaviconGate" x1="50" y1="45" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <!-- Plate gradient. Lightened one step from the original near-black navy
         (#1e293b / #1b2440 / #2a2158) so the icon no longer reads as a black square in a
         tab strip. Every stop stays dark enough to keep the mark legible: relative luminance
         ~0.033-0.042 against ~0.20-0.38 for the flow gradient (cyan ~4.7:1, blue ~3.4:1,
         violet end ~3.0:1). Lightening it further requires brightening the violet stop of the
         flow gradient first, otherwise the S tail and the orbit ring fall under 3:1. -->
    <linearGradient id="scrumoothFaviconPlate" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b3a55" />
      <stop offset="60%" stop-color="#28324f" />
      <stop offset="100%" stop-color="#362c68" />
    </linearGradient>
    <!-- Knockout that severs the flow at the gate. White keeps, black cuts. -->
    <mask id="scrumoothFaviconCut" maskUnits="userSpaceOnUse" mask-type="luminance" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#ffffff" />
      <circle cx="50" cy="50" r="7.4" fill="#000000" />
    </mask>
  </defs>

  <rect width="128" height="128" rx="33" fill="url(#scrumoothFaviconPlate)" />

  <!-- scale 1.15 keeps the mark at the same plate ratio as the header badge
       (BrandMark.astro draws it at 0.9 on a 100-unit plate; 1.15 / 1.28 = 0.898).
       Optical size for the favicon: the S is additionally scaled 1.12 about the centre
       (canvas 100 units: 60.2 -> 66.0 units tall, 54% -> 59% of the plate) so the
       letterform still reads at 16 px. Stroke weight (12), gate cut (r 7.4) and gate node
       (r 4.9) are deliberately left untouched, and the clearance to the orbit ring stays
       ~1.8x the ring stroke, so the mark never turns into a single blob. -->
  <g transform="translate(64 64) scale(1.15) translate(-50 -50)">
    <!-- Orbit — the sprint cycle -->
    <circle cx="50" cy="50" r="41" stroke="url(#scrumoothFaviconFlow)" stroke-width="3.4" opacity="0.8" />

    <!-- Flow — the Scrumooth S, gated at its midpoint -->
    <path
      d="M 67.2 30.65 C 67.2 19.89 32.8 19.89 32.8 33.87 C 32.8 47.31 67.2 52.69 67.2 66.13 C 67.2 80.11 32.8 80.11 32.8 69.35"
      stroke="url(#scrumoothFaviconFlow)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
      mask="url(#scrumoothFaviconCut)"
    />

    <!-- Gate node — the checkpoint the flow passes through -->
    <circle cx="50" cy="50" r="4.9" fill="url(#scrumoothFaviconGate)" />
  </g>
</svg>
