name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.1.0). Tag must already exist.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_no_v: ${{ steps.version.outputs.version_no_v }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version format: ${VERSION}. Expected format: vMAJOR.MINOR.PATCH (e.g., v1.2.0)"
            exit 1
          fi
          
          VERSION_NO_V="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (Docker tag: ${VERSION_NO_V})"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version_no_v }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "Tag version: ${TAG_VERSION}"
          echo "package.json version: ${PACKAGE_VERSION}"
          
          if [[ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo ""
            echo "::error::Version mismatch detected!"
            echo "::error::The version in package.json (${PACKAGE_VERSION}) does not match the tag version (${TAG_VERSION})."
            echo ""
            echo "This usually happens when a tag is pushed directly without using the prepare-release workflow."
            echo ""
            echo "To create a proper release, please:"
            echo "  1. Delete this tag: git push --delete origin ${{ steps.version.outputs.version }}"
            echo "  2. Use the prepare-release workflow:"
            echo "     gh workflow run prepare-release.yml -f version=${{ steps.version.outputs.version }}"
            echo "  3. Review and merge the created PR"
            exit 1
          fi
          
          echo "✅ Version verified: package.json version matches tag version"

      - name: Verify CI passed on this commit
        uses: ./.github/actions/wait-for-ci
        with:
          commit-sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          timeout-message: 'A successful CI run is required before releasing. Trigger CI manually or wait for it to complete, then re-run this workflow.'

  build-and-push:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            file: packages/backend/Dockerfile
            target: production
            extra-build-args: ''
          - image: backup
            context: ./scripts/maintenance/database
            file: ./scripts/maintenance/database/Dockerfile
            target: ''
            extra-build-args: ''
          - image: frontend
            context: .
            file: packages/frontend/Dockerfile
            target: production
            extra-build-args: |
              VITE_BASE_PATH=/scrumooth/
              VITE_API_URL=/api/v1
              VITE_USE_MOCK_API=false
              VITE_BACKLOG_ITEM_LIMIT=100
              VITE_BACKLOG_MAX_ITEMS_PER_GOAL=200
              VITE_LOG_LEVEL=info
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version_no_v }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version_no_v }}
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            BUILD_DATE=${{ github.event.repository.pushed_at || github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            ${{ matrix.extra-build-args }}

      - name: Write build summary
        run: |
          echo "### ${{ matrix.image }} Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|" >> $GITHUB_STEP_SUMMARY
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            echo "| \`${tag}\` |" >> $GITHUB_STEP_SUMMARY
          done

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build-and-push]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create smoke test compose file
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ needs.validate.outputs.version_no_v }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ needs.validate.outputs.version_no_v }}
        run: |
          BACKEND_IMAGE=$(echo "$BACKEND_IMAGE" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMAGE=$(echo "$FRONTEND_IMAGE" | tr '[:upper:]' '[:lower:]')
          
          cat > /tmp/smoke-test.yml << EOF
          services:
            postgres:
              image: postgres:18-alpine
              environment:
                POSTGRES_USER: scrumooth_smoke_test
                POSTGRES_PASSWORD: Sm0keT3st_Str0ng_P@ssw0rd_2024!
                POSTGRES_DB: scrumooth_test
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U scrumooth_smoke_test -d scrumooth_test"]
                interval: 5s
                timeout: 3s
                retries: 10
                start_period: 10s

            backend:
              image: ${BACKEND_IMAGE}
              environment:
                DATABASE_URL: postgresql://scrumooth_smoke_test:Sm0keT3st_Str0ng_P@ssw0rd_2024!@postgres:5432/scrumooth_test
                JWT_SECRET: smoke-test-jwt-secret-for-production-validation-minimum-64-characters-long!
                NODE_ENV: production
                CORS_ORIGIN: https://scrumooth.example.com
                PORT: "5010"
                EMAIL_PROVIDER: smtp
                SMTP_HOST: smtp.example.com
                SMTP_PORT: "587"
                SMTP_USER: smoke-test@example.com
                SMTP_PASS: Sm0keT3st_SMTP_P@ssw0rd_2024!
                EMAIL_FROM_ADDRESS: noreply@scrumooth.example.com
                FRONTEND_URL: https://scrumooth.example.com
              ports:
                - "5010:5010"
              healthcheck:
                test: ["CMD", "node", "-e", "require('http').get('http://localhost:5010/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 30s

            frontend:
              image: ${FRONTEND_IMAGE}
              ports:
                - "8080:80"
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
                interval: 10s
                timeout: 5s
                retries: 3
                start_period: 5s
          EOF

      - name: Start PostgreSQL
        run: docker compose -f /tmp/smoke-test.yml up -d postgres

      - name: Wait for PostgreSQL
        run: |
          ELAPSED=0
          MAX_WAIT=60
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if docker compose -f /tmp/smoke-test.yml exec -T postgres pg_isready -U scrumooth_smoke_test -d scrumooth_test > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "::error::PostgreSQL did not become ready within ${MAX_WAIT}s"
            exit 1
          fi

      - name: Start backend
        run: docker compose -f /tmp/smoke-test.yml up -d backend

      - name: Wait for backend to start
        run: |
          echo "Waiting for backend to start..."
          sleep 5
          
          for i in $(seq 1 30); do
            STATUS=$(docker compose -f /tmp/smoke-test.yml ps backend --format json 2>/dev/null | jq -r '.[0].State' 2>/dev/null || echo "unknown")
            echo "Backend status: ${STATUS} (attempt ${i}/30)"
            
            if [[ "${STATUS}" == "exited" || "${STATUS}" == "dead" ]]; then
              echo "::error::Backend container exited unexpectedly"
              echo "=== Backend Logs ==="
              docker compose -f /tmp/smoke-test.yml logs backend 2>&1 || true
              exit 1
            fi
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5010/health 2>/dev/null || echo "000")
            if [[ "${HTTP_CODE}" == "200" ]]; then
              echo "Backend is healthy (HTTP 200)"
              exit 0
            fi
            
            sleep 2
          done
          
          echo "::error::Backend did not become healthy within 60s"
          echo "=== Backend Logs ==="
          docker compose -f /tmp/smoke-test.yml logs backend 2>&1 || true
          exit 1

      - name: Run database migrations
        run: |
          echo "Running database migrations..."
          docker compose -f /tmp/smoke-test.yml exec -T backend sh -c "npx prisma migrate deploy" 2>&1 || {
            echo "::warning::Migration via exec failed, trying alternative approach..."
            docker compose -f /tmp/smoke-test.yml run --rm backend sh -c "npx prisma migrate deploy" 2>&1 || {
              echo "::warning::Migration command not available in production image. Skipping migrations."
              echo "Note: The application may handle migrations on startup, or migrations need to be run separately."
            }
          }

      - name: Start frontend
        run: docker compose -f /tmp/smoke-test.yml up -d frontend

      - name: Wait for frontend
        run: |
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ 2>/dev/null || echo "000")
            if [[ "${HTTP_CODE}" == "200" ]]; then
              echo "Frontend is healthy (HTTP 200)"
              exit 0
            fi
            echo "Waiting for frontend... (attempt ${i}/15, HTTP ${HTTP_CODE})"
            sleep 2
          done
          echo "::warning::Frontend health check did not return 200, but continuing..."

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Service Logs ==="
          docker compose -f /tmp/smoke-test.yml logs
          echo ""
          echo "=== Service Status ==="
          docker compose -f /tmp/smoke-test.yml ps -a

      - name: Write smoke test summary
        if: always()
        run: |
          echo "### 🔍 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PostgreSQL | \`postgres:18-alpine\` | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ needs.validate.outputs.version_no_v }}\` | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ needs.validate.outputs.version_no_v }}\` | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose -f /tmp/smoke-test.yml down -v --remove-orphans

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, smoke-test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          
          if [[ ! -f "CHANGELOG.md" ]]; then
            echo "Release ${{ needs.validate.outputs.version }}. See CHANGELOG.md for details." > /tmp/changelog.md
            exit 0
          fi
          
          sed -n "/^## \[${VERSION_NO_V}\]/,/^## \[/p" CHANGELOG.md | head -n -1 > /tmp/changelog.md
          
          if [[ ! -s /tmp/changelog.md ]]; then
            echo "Release ${{ needs.validate.outputs.version }}. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." > /tmp/changelog.md
          fi

      - name: Build release body
        env:
          VERSION_NO_V: ${{ needs.validate.outputs.version_no_v }}
          REPO: ${{ github.repository }}
          PREV_TAG: ${{ steps.prev-tag.outputs.prev_tag }}
        run: |
          {
            echo "## Docker Images"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${REPO}/backend:${VERSION_NO_V}"
            echo "docker pull ghcr.io/${REPO}/frontend:${VERSION_NO_V}"
            echo '```'
            echo ""
            echo "## Deployment"
            echo ""
            echo "See the [Deployment Guide](https://github.com/${REPO}/blob/v${VERSION_NO_V}/docs/deployment/DEPLOYMENT.md) for complete setup instructions."
            echo ""
            echo "Quick start:"
            echo ""
            echo '```bash'
            echo "git clone --depth 1 --branch v${VERSION_NO_V} https://github.com/${REPO}.git"
            echo "cd scrumooth"
            echo "cp packages/backend/.env.example packages/backend/.env.production"
            echo "# Edit .env.production with your settings"
            echo "docker compose up -d"
            echo '```'
            echo ""
            echo "## What's Changed"
            echo ""
            cat /tmp/changelog.md
          } > /tmp/release-body.md
          
          if [[ -n "${PREV_TAG}" ]]; then
            echo "" >> /tmp/release-body.md
            echo "---" >> /tmp/release-body.md
            echo "" >> /tmp/release-body.md
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...v${VERSION_NO_V}" >> /tmp/release-body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Scrumooth ${{ needs.validate.outputs.version }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release summary
        run: |
          echo "### 🚀 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo '- `ghcr.io/${{ github.repository }}/backend:${{ needs.validate.outputs.version_no_v }}`' >> $GITHUB_STEP_SUMMARY
          echo '- `ghcr.io/${{ github.repository }}/frontend:${{ needs.validate.outputs.version_no_v }}`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
