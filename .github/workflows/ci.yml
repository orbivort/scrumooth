name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '**.drawio'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore: *paths-ignore
  workflow_dispatch:

env:
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '11.21.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'packages/backend/**'
            frontend:
              - 'packages/frontend/**'
            shared:
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'tsconfig.build.json'
              - 'eslint.config.js'

  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate branch name
        run: node scripts/utility/validate-git-branch.js "${{ github.head_ref }}"

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, validate-branch-name]
    if: >-
      always() &&
      needs.validate-branch-name.result != 'failure' &&
      (needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Stylelint (CSS linting)
        run: pnpm run lint:css

      - name: Run Prettier (format check)
        run: pnpm run format:check

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: i18n check
        run: pnpm run i18n:check

      - name: i18n glossary
        run: pnpm run i18n:glossary

      - name: i18n completeness
        run: pnpm run i18n:completeness
        continue-on-error: true

      - name: Locale JSON size report
        run: |
          echo "### Locale JSON Sizes" >> $GITHUB_STEP_SUMMARY
          echo '| File | Size |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          find packages/frontend/public/locales packages/backend/src/locales -name '*.json' -exec sh -c 'size=$(wc -c < "$1"); echo "| $1 | ${size} bytes |" >> $GITHUB_STEP_SUMMARY; if [ "$size" -gt 51200 ]; then echo "::warning::$1 exceeds 50KB (${size} bytes)"; fi' _ {} \;

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Run frontend tests
        run: pnpm --filter=@scrumooth/frontend run test

  test-frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-typecheck, detect-changes]
    if: >-
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    # The dev server the specs drive is configured by `webServer.env` in
    # packages/frontend/playwright.config.ts, so mock mode and the same-origin API
    # base are set there rather than here: one place, no value that can disagree
    # with what the config already says.
    env:
      CI: true
      E2E_BROWSERS: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/frontend/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@scrumooth/frontend exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@scrumooth/frontend exec playwright install-deps chromium firefox webkit

      - name: Run frontend E2E tests (Shard ${{ matrix.shard }})
        run: pnpm --filter=@scrumooth/frontend exec playwright test --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-e2e-report-${{ strategy.job-index }}
          path: |
            packages/frontend/playwright-report
            packages/frontend/test-results
          retention-days: 7

  test-frontend-e2e-smoke:
    name: Frontend E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, detect-changes]
    if: >-
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true') &&
      github.event_name == 'pull_request'
    # As above: the mock flags live in playwright.config.ts's `webServer.env`.
    env:
      CI: true
      E2E_BROWSERS: chromium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/frontend/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@scrumooth/frontend exec playwright install --with-deps chromium

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@scrumooth/frontend exec playwright install-deps chromium

      - name: Run frontend E2E smoke tests
        run: pnpm --filter=@scrumooth/frontend exec playwright test --grep=@smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-e2e-smoke-report
          path: |
            packages/frontend/playwright-report
            packages/frontend/test-results
          retention-days: 7

  test-frontend-coverage:
    name: Frontend Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-frontend, detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Run frontend tests with coverage
        run: pnpm --filter=@scrumooth/frontend run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: packages/frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-coverage
          path: packages/frontend/coverage
          retention-days: 7

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Run backend unit tests
        run: pnpm --filter=@scrumooth/backend run test:unit

  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    services:
      postgres: &postgres-service
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scrumooth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/scrumooth_test
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Run database migrations
        run: pnpm --filter=@scrumooth/backend exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm --filter=@scrumooth/backend run test:integration

  test-backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint-and-typecheck, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    services:
      postgres: *postgres-service
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/scrumooth_test
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Run database migrations
        run: pnpm --filter=@scrumooth/backend exec prisma migrate deploy

      - name: Run E2E tests
        run: pnpm --filter=@scrumooth/backend run test:e2e

  test-backend-coverage:
    name: Backend Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test-backend, test-backend-integration, test-backend-e2e, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    services:
      postgres: *postgres-service
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/scrumooth_test
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-shared: 'true'

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Run database migrations
        run: pnpm --filter=@scrumooth/backend exec prisma migrate deploy

      - name: Run all backend tests with coverage
        run: pnpm --filter=@scrumooth/backend run test:coverage

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: packages/backend/coverage
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: packages/backend/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        test-frontend,
        test-frontend-e2e,
        test-frontend-e2e-smoke,
        test-frontend-coverage,
        test-backend,
        test-backend-integration,
        test-backend-e2e,
        test-backend-coverage,
        detect-changes,
      ]
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Cache TypeScript build
        uses: actions/cache@v5
        with:
          path: |
            packages/*/dist
            packages/*/.tsbuildinfo
          key: ${{ runner.os }}-ts-build-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ts-build-

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Build all packages
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            packages/backend/dist
            packages/frontend/dist
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run pnpm audit (using official registry)
        run: pnpm audit --registry https://registry.npmjs.org/ --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['typescript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Analyze bundle size
        id: bundle-size
        run: |
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|---------|" >> $GITHUB_STEP_SUMMARY

          cd packages/frontend/dist
          for file in $(find . -name "*.js" -o -name "*.css" | head -20); do
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            SIZE_KB=$(echo "scale=2; $SIZE / 1024" | bc)
            GZIP_SIZE=$(gzip -c "$file" | wc -c)
            GZIP_KB=$(echo "scale=2; $GZIP_SIZE / 1024" | bc)
            echo "| $file | ${SIZE_KB} KB | ${GZIP_KB} KB |" >> $GITHUB_STEP_SUMMARY
          done

          TOTAL_SIZE=$(du -sb . | cut -f1)
          TOTAL_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Bundle Size:** ${TOTAL_MB} MB" >> $GITHUB_STEP_SUMMARY

      - name: Upload bundle stats
        uses: actions/upload-artifact@v6
        with:
          name: bundle-stats
          path: packages/frontend/dist/stats.html
          retention-days: 7
        continue-on-error: true

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Setup Prisma Client
        uses: ./.github/actions/setup-prisma

      - name: Run performance benchmarks
        run: pnpm --filter=@scrumooth/backend run test -- --run --benchmark
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Generate performance report
        id: perf-report
        run: |
          echo "### Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance benchmarks completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Note: Detailed benchmark results are available in the uploaded artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-results
          path: packages/backend/benchmark-results
          retention-days: 7
        continue-on-error: true
